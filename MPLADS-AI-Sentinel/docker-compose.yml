version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: mplads_postgres
    environment:
      POSTGRES_DB: mplads_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: mplads_backend
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/mplads_db
      - SECRET_KEY=mplads-ai-sentinel-secret-key-2026-hackathon-mospi
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "python scripts/seed_db.py && uvicorn backend.app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mplads_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
